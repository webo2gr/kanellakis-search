<!DOCTYPE html>
<html lang="el"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanellakis Search</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--sur:#fff;--bdr:#e0ddd8;--txt:#1a1917;--mut:#6b6860;--acc:#c8390a;--grn:#1a7a4a;--gl:#edf7f2;--ylw:#b45309;--yl:#fef9ee;--rl:#fdf1ee;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--txt);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px;white-space:nowrap}.logo span{color:var(--acc)}
.sw{flex:1;position:relative}
#si{width:100%;padding:9px 14px 9px 36px;border:none;border-radius:var(--r);font-family:'IBM Plex Sans',sans-serif;font-size:15px;background:rgba(255,255,255,.15);color:#fff;outline:none}
#si::placeholder{color:rgba(255,255,255,.5)}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.cnt{padding:12px}
.sb{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:12px;font-size:13px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0}.dot.ok{background:var(--grn)}.dot.err{background:var(--acc)}.dot.sp{background:var(--ylw);animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.ri{font-size:12px;color:var(--mut);margin-bottom:10px;font-family:'IBM Plex Mono',monospace}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--r);padding:12px;transition:all .15s}
.card:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.1)}.card.added{border-color:var(--grn);background:var(--gl)}
.sku{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);margin-bottom:4px}
.name{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:10px}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace}
.badge.in{background:var(--gl);color:var(--grn)}.badge.low{background:var(--yl);color:var(--ylw)}.badge.out{background:var(--rl);color:var(--acc)}
.abtn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.abtn:hover{background:var(--acc);color:#fff}.abtn.added{background:var(--grn);border-color:var(--grn);color:#fff}
.sv{text-align:center;padding:50px 20px;color:var(--mut)}
.spinner{width:30px;height:30px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.fab{position:fixed;bottom:18px;right:18px;background:var(--txt);color:#fff;border:none;border-radius:28px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200}
.fab.hidden{display:none}.bc{background:var(--acc);border-radius:12px;padding:2px 7px;font-size:12px;font-weight:700}
.panel{position:fixed;bottom:0;right:0;left:0;background:var(--sur);border-top:2px solid var(--bdr);z-index:300;transform:translateY(100%);transition:transform .3s;max-height:72vh;overflow-y:auto;border-radius:16px 16px 0 0}
.panel.open{transform:translateY(0)}
.ph{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--sur)}
.ph h2{font-size:15px;font-weight:600}.xb{background:none;border:none;font-size:22px;cursor:pointer;color:var(--mut)}
.pi{padding:10px 18px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr)}.pitem:last-child{border-bottom:none}
.pn{flex:1;font-size:13px}.ps{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut)}
.qc{display:flex;align-items:center;gap:5px;background:var(--bg);border-radius:20px;padding:3px 7px}
.qb{background:none;border:none;font-size:18px;cursor:pointer;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.qn{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;min-width:22px;text-align:center}
.rb{background:none;border:none;color:var(--acc);cursor:pointer;font-size:15px;padding:3px}
.pf{padding:14px 18px;border-top:1px solid var(--bdr);display:flex;gap:8px}
.sbtn{flex:1;padding:12px;background:var(--acc);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer}
.cbtn{padding:12px 14px;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);font-size:13px;cursor:pointer}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">Kanellakis<span>.</span></div>
  <div class="sw">
    <svg class="sico" width="15" height="15" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="si" placeholder="Search products..." autocomplete="off">
  </div>
</header>
<div class="cnt">
  <div class="sb"><div class="dot sp" id="sd"></div><span id="st">Loading...</span></div>
  <div id="ri" class="ri" style="display:none"></div>
  <div class="grid" id="pg"></div>
  <div id="sv"></div>
</div>
<button class="fab hidden" id="fab" onclick="openB()">Cart <span class="bc" id="bcount">0</span></button>
<div class="panel" id="panel">
  <div class="ph"><h2>Order List</h2><button class="xb" onclick="closeB()">x</button></div>
  <div class="pi" id="pi"></div>
  <div class="pf"><button class="cbtn" onclick="copyL()">Copy</button><button class="sbtn" onclick="sendWA()">WhatsApp</button></div>
</div>
